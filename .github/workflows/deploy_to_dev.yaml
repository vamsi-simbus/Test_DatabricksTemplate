name: deploy_to_dev

concurrency: 1

on:
  workflow_dispatch

env:
  DATABRICKS_HOST: ${{vars.HOST}}
  DATABRICKS_TOKEN: ${{secrets.TOKEN}}

jobs:
  deploy:
    environment: dev
    name: "Deploy bundle"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        
     # - uses: databricks/setup-cli@main

      - name: install-databricks-cli
        uses: microsoft/install-databricks-cli@v0.244.0

    ##  - run: |
    ##      databricks auth login --host ${{ vars.DATABRICKS_HOST }}
    ##

      - run: |
          databricks bundle validate --profile dev -t dev
        working-directory: .  
        env:
          DATABRICKS_HOST: ${{vars.HOST}}
          DATABRICKS_TOKEN: ${{secrets.TOKEN}}
          DATABRICKS_BUNDLE_ENV: dev

      - run: |
          databricks bundle deploy --profile dev -t dev
        working-directory: .  
        env:
          DATABRICKS_HOST: ${{vars.HOST}}
          DATABRICKS_TOKEN: ${{secrets.TOKEN}}
          DATABRICKS_BUNDLE_ENV: dev  
         
